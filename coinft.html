  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;

  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;

  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());

    &quot;codex-visualization-widget-state&quot;,
  );

  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },

    );
  /**

   * @param {string} property

    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply

      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);

  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;

  let hostPort = null;
  const postToHost = (type, payload) =&gt; {

      apply(postHostMessage, hostPort, [{ type, ...payload }]);

   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;

      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)

      nextState,

          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||

      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)

      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());

      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {

                }

            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });

    { capture: true },
  );

  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);

        target == null ||
        globalThis.navigator.userActivation?.isActive !== true

        return;
      }

      });
      return;
    }

  syncTheme();
})();

&lt;style&gt;
#coinft-observatory{--cf-bg:#040c17;--cf-panel:#071524;--cf-text:#e8f5ff;--cf-dim:#8aa6bc;--cf-line:#173045;--cf-cyan:#4ee5ff;--cf-pink:#f194c5;color-scheme:dark;background:var(--cf-bg);color:var(--cf-text);font:14px/1.5 -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;border-radius:18px;overflow:hidden;max-width:1100px;margin:auto;isolation:isolate}
#coinft-observatory *{box-sizing:border-box}
#coinft-observatory h1,#coinft-observatory h2,#coinft-observatory h3,#coinft-observatory p{margin:0}
#coinft-observatory .cf-header{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:28px 30px 25px;background:radial-gradient(ellipse at 90% 0%,#0b364b 0%,transparent 60%)}
#coinft-observatory .cf-eyebrow{font:11px/1.5 ui-monospace,monospace;letter-spacing:2px;color:var(--cf-cyan);margin-bottom:8px}
#coinft-observatory .cf-eyebrow span,#coinft-observatory .cf-footer span span{color:#4d6d85;padding:0 8px}
#coinft-observatory h1{font-size:32px;line-height:1.2;letter-spacing:-1.2px;font-weight:500}
#coinft-observatory .cf-subtitle{color:var(--cf-dim);font-size:12px;margin-top:8px}
#coinft-observatory .cf-model{flex-shrink:0;font:12px/1.5 ui-monospace,monospace;letter-spacing:1px;text-align:right}
#coinft-observatory .cf-model small{display:block;font-size:10px;letter-spacing:.7px;color:var(--cf-dim);margin-top:5px}
#coinft-observatory .cf-led{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--cf-cyan);box-shadow:0 0 12px var(--cf-cyan);margin-right:8px}
#coinft-observatory button,#coinft-observatory select,#coinft-observatory input[type=number]{font-family:inherit;font-size:12px;line-height:1.5;color:var(--cf-text);background:#0b1c2d;border:1px solid #294255;border-radius:7px;padding:8px 12px;min-height:36px}
#coinft-observatory button{font-family:inherit;font-size:12px;white-space:nowrap}
#coinft-observatory button:hover,#coinft-observatory select:hover{background:#12314a;border-color:#41748e}
#coinft-observatory button:disabled{opacity:.35}
#coinft-observatory .cf-primary{color:#04101b;background:var(--cf-cyan);border-color:var(--cf-cyan);font-weight:500;padding-inline:16px}
#coinft-observatory .cf-primary:hover{background:#9bf1ff}
#coinft-observatory .cf-primary span{margin-left:16px}
#coinft-observatory button[aria-pressed=true]{border-color:var(--cf-cyan);color:var(--cf-cyan)}
#coinft-observatory .cf-toolbar{padding:0 30px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
#coinft-observatory .cf-actions{display:flex;gap:8px;flex-wrap:wrap}
#coinft-observatory .cf-playback-controls{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
#coinft-observatory .cf-edge-choice{display:flex;align-items:center;gap:9px;color:var(--cf-dim);font-size:11px}
#coinft-observatory select{font-family:inherit;font-size:12px;padding:7px 9px;max-width:100%}
#coinft-observatory .cf-stage{background:radial-gradient(ellipse at 40% 48%,#072337 0%,#051322 46%,#030d18 90%);position:relative;border-top:1px solid var(--cf-line);border-bottom:1px solid var(--cf-line)}
#coinft-observatory .cf-stage-top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 24px 0;color:var(--cf-dim);font:10px/1.5 ui-monospace,monospace;letter-spacing:1px}
#coinft-observatory #cf-status{color:var(--cf-cyan);letter-spacing:.3px}
#coinft-observatory #cf-network{display:block;width:100%;height:440px;touch-action:pan-y}
#coinft-observatory .cf-stage-bottom{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:0 24px 16px;color:var(--cf-dim);font-size:10px}
#coinft-observatory .cf-legend{display:flex;gap:14px;flex-wrap:wrap}
#coinft-observatory .cf-legend i{display:inline-block;width:16px;vertical-align:middle;margin-right:5px;border-top:1px solid var(--cf-cyan)}
#coinft-observatory .cf-legend i.cf-negative{border-top:1px dashed var(--cf-pink)}
#coinft-observatory .cf-transport{padding:18px 30px 13px;background:#071321}
#coinft-observatory .cf-sample-heading{display:flex;justify-content:space-between;gap:8px;color:var(--cf-dim);font:10px/1.5 ui-monospace,monospace;letter-spacing:.7px}
#coinft-observatory #cf-sample-label{color:var(--cf-text);margin-left:12px;letter-spacing:0;font-variant-numeric:tabular-nums}
#coinft-observatory .cf-slow{font-family:inherit;letter-spacing:0}
#coinft-observatory .cf-scrub{display:flex;align-items:center;gap:14px;margin-top:8px}
#coinft-observatory .cf-scrub button{min-width:34px;padding:4px 8px;background:transparent;border-color:transparent;font-size:18px}
#coinft-observatory input[type=range]{width:100%;min-width:0;accent-color:var(--cf-cyan);margin:0;height:28px}
#coinft-observatory .cf-results{padding:22px 30px 24px}
#coinft-observatory .cf-section-heading{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:13px}
#coinft-observatory h2{font-size:14px;line-height:1.4;font-weight:500}
#coinft-observatory .cf-section-heading&gt;span{font:10px/1.5 ui-monospace,monospace;letter-spacing:.5px;color:var(--cf-dim)}
#coinft-observatory .cf-divider{margin:0 7px;color:#426078}
#coinft-observatory .cf-output-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
#coinft-observatory .cf-output{min-width:0;padding:0 12px 0 0;border-right:1px solid var(--cf-line);font-variant-numeric:tabular-nums}
#coinft-observatory .cf-output:last-child{border:0}
#coinft-observatory .cf-output-label{display:flex;justify-content:space-between;color:var(--cf-dim);font:11px/1.5 ui-monospace,monospace}
#coinft-observatory .cf-output-value{font:24px/1.4 ui-monospace,SFMono-Regular,monospace;letter-spacing:-1.2px;margin:5px 0}
#coinft-observatory .cf-output-reference{font:11px/1.6 ui-monospace,monospace;color:var(--cf-dim)}
#coinft-observatory .cf-output-reference b{color:var(--cf-text);font-weight:400}
#coinft-observatory .cf-residual{font:10px/1.6 ui-monospace,monospace;color:var(--cf-dim);margin-top:4px}
#coinft-observatory .cf-bottom-grid{display:grid;grid-template-columns:1fr 1fr;border-block:1px solid var(--cf-line)}
#coinft-observatory .cf-inputs,#coinft-observatory .cf-inspector{padding:20px 30px;min-width:0}
#coinft-observatory .cf-inputs{border-right:1px solid var(--cf-line)}
#coinft-observatory .cf-input-bars{height:83px;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:8px}
#coinft-observatory .cf-input-channel{min-width:0;text-align:center;font:10px/1.5 ui-monospace,monospace;color:var(--cf-dim)}
#coinft-observatory .cf-input-track{height:54px;background:#0e2032;position:relative;margin-bottom:5px;overflow:hidden}
#coinft-observatory .cf-input-track:after{content:&quot;&quot;;position:absolute;top:50%;height:1px;inset-inline:0;background:#3e576e}
#coinft-observatory .cf-input-bar{position:absolute;left:0;right:0;background:var(--cf-cyan)}
#coinft-observatory .cf-inspect-header{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap}
#coinft-observatory .cf-inspect-controls{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--cf-dim)}
#coinft-observatory .cf-inspect-controls select{min-height:30px;padding:3px 7px}
#coinft-observatory .cf-inspect-controls input{width:50px;min-height:30px;padding:3px 4px;font-family:ui-monospace,monospace;font-size:12px}
#coinft-observatory .cf-inspect-metrics{display:flex;justify-content:space-between;gap:12px}
#coinft-observatory .cf-inspect-metrics span{color:var(--cf-dim);font:10px/1.5 ui-monospace,monospace}
#coinft-observatory .cf-inspect-metrics strong{display:block;font:16px/1.5 ui-monospace,monospace;color:var(--cf-text);font-weight:400}
#coinft-observatory .cf-incoming{font:10px/1.5 ui-monospace,monospace;color:var(--cf-dim);margin-top:10px;overflow-wrap:anywhere}
#coinft-observatory .cf-about{padding:16px 30px;color:var(--cf-dim);font-size:12px}
#coinft-observatory summary{color:var(--cf-text)}
#coinft-observatory summary span{float:right;color:var(--cf-dim);font:10px/1.7 ui-monospace,monospace}
#coinft-observatory .cf-about-content{display:grid;grid-template-columns:1fr 1fr;gap:32px;padding:18px 0 5px}
#coinft-observatory h3{font-size:12px;font-weight:500;color:var(--cf-text);margin-bottom:10px}
#coinft-observatory #cf-rmse{display:grid;grid-template-columns:1fr 1fr;gap:5px 18px;font:11px/1.6 ui-monospace,monospace}
#coinft-observatory .cf-provenance{font-size:11px;overflow-wrap:anywhere}
#coinft-observatory .cf-provenance&gt;div{margin-bottom:6px}
#coinft-observatory .cf-note{color:#edca94}
#coinft-observatory a{color:var(--cf-cyan)}
#coinft-observatory .cf-footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 30px 20px;color:#7a9bb4;font:10px/1.5 ui-monospace,monospace;letter-spacing:.6px}
#coinft-observatory .cf-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(max-width:760px){#coinft-observatory .cf-header{align-items:flex-start;padding:24px}#coinft-observatory .cf-model small{max-width:160px;font-size:10px}#coinft-observatory h1{font-size:27px}#coinft-observatory .cf-output-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 16px}#coinft-observatory .cf-output:nth-child(3){border:0}#coinft-observatory .cf-bottom-grid{grid-template-columns:1fr}#coinft-observatory .cf-inputs{border-right:0;border-bottom:1px solid var(--cf-line)}#coinft-observatory .cf-about-content{grid-template-columns:1fr}#coinft-observatory .cf-stage-top&gt;span:last-child{display:none}#coinft-observatory .cf-section-heading&gt;span{font-size:10px}#coinft-observatory .cf-slow{display:none}}
@media(max-width:520px){#coinft-observatory{border-radius:12px}#coinft-observatory .cf-header{display:block;padding:22px 18px}#coinft-observatory .cf-model{margin-top:17px;display:flex;align-items:center;text-align:left;font-size:11px;gap:4px}#coinft-observatory .cf-model small{margin:0 0 0 auto;max-width:120px;line-height:1.5;font-size:10px}#coinft-observatory .cf-toolbar{padding:0 18px 18px}#coinft-observatory .cf-actions{gap:6px}#coinft-observatory .cf-actions button{padding:7px 10px;font-size:11px;min-height:40px}#coinft-observatory .cf-primary span{margin-left:5px}#coinft-observatory #cf-network{height:780px}#coinft-observatory .cf-stage-top{padding:14px 18px 0}#coinft-observatory .cf-stage-bottom{padding:0 18px 16px}#coinft-observatory .cf-transport,#coinft-observatory .cf-results,#coinft-observatory .cf-inputs,#coinft-observatory .cf-inspector,#coinft-observatory .cf-about{padding:18px}#coinft-observatory .cf-section-heading{align-items:flex-start}#coinft-observatory .cf-results .cf-section-heading&gt;span{max-width:128px;text-align:right}#coinft-observatory .cf-output-value{font-size:22px}#coinft-observatory .cf-output-reference{font-size:10px}#coinft-observatory .cf-output-grid{gap:20px 10px}#coinft-observatory .cf-output{padding-right:8px}#coinft-observatory .cf-input-bars{gap:6px}#coinft-observatory summary span{float:none;display:block;margin:8px 0 0 14px}#coinft-observatory .cf-footer{padding:4px 18px 18px;font-size:10px;letter-spacing:0}}
&lt;/style&gt;

#coinft-observatory{font-family:&quot;CoinFT Noto&quot;,&quot;Noto Sans&quot;,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif;max-width:1440px}
#coinft-observatory h1{letter-spacing:-.8px;font-weight:400}
#coinft-observatory .cf-eyebrow,#coinft-observatory .cf-model,#coinft-observatory .cf-stage-top,#coinft-observatory .cf-sample-heading,#coinft-observatory .cf-section-heading&gt;span,#coinft-observatory .cf-footer,#coinft-observatory summary span{font-family:inherit}
#coinft-observatory .cf-signal-layout{display:grid;grid-template-columns:132px minmax(0,1fr) 250px;align-items:stretch}
#coinft-observatory #cf-network{height:610px;min-width:0}
#coinft-observatory .cf-inputs{display:flex;flex-direction:column;justify-content:center;padding:18px 12px;border:0}
#coinft-observatory .cf-inputs .cf-section-heading{display:block;margin:0 0 22px}
#coinft-observatory .cf-inputs h2{font-size:13px;line-height:1.6;margin-bottom:7px}
#coinft-observatory .cf-inputs .cf-section-heading&gt;span{font-size:9px;letter-spacing:1px}
#coinft-observatory .cf-input-bars{display:flex;flex-direction:column;gap:11px;height:auto}
#coinft-observatory .cf-input-channel{display:grid;grid-template-columns:15px minmax(0,1fr) 31px;gap:5px;align-items:center;text-align:left;font-size:10px}
#coinft-observatory .cf-input-track{height:7px;margin:0;border-radius:2px;background:#132b3c;overflow:visible}
#coinft-observatory .cf-input-track:after{inset:auto;left:50%;top:-2px;height:11px;width:1px;background:#56748b}
#coinft-observatory .cf-input-bar{inset:0 auto 0 50%;height:100%;border-radius:1px}
#coinft-observatory .cf-input-number{text-align:right;color:#b9d5e5;font-variant-numeric:tabular-nums}
#coinft-observatory .cf-wrench{min-width:0;padding:14px 16px 8px;border-left:1px solid #123044;background:linear-gradient(90deg,#071c2b88,transparent)}
#coinft-observatory .cf-wrench-heading{display:flex;align-items:center;justify-content:space-between;gap:6px}
#coinft-observatory .cf-wrench-heading h2{font-size:14px}
#coinft-observatory #cf-view{font-size:11px;min-height:30px;padding:3px 6px}
#coinft-observatory .cf-vector-legend{display:flex;align-items:center;gap:9px;flex-wrap:wrap;color:var(--cf-dim);font-size:10px;margin:8px 0 14px}
#coinft-observatory .cf-pred-key:before,#coinft-observatory .cf-ref-key:before{content:&quot;&quot;;display:inline-block;width:11px;border-top:2px solid #c9efff;vertical-align:middle;margin-right:5px}
#coinft-observatory .cf-ref-key:before{border-top:1px dashed #9bacbb}
#coinft-observatory .cf-vector-legend&gt;span:last-child{margin-left:auto;font-size:9px}
#coinft-observatory .cf-spatial-panel+.cf-spatial-panel{margin-top:16px;border-top:1px solid var(--cf-line);padding-top:14px}
#coinft-observatory .cf-vector-heading{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-variant-numeric:tabular-nums}
#coinft-observatory .cf-vector-heading h3{font-size:13px;margin:0}
#coinft-observatory .cf-vector-heading h3&gt;span{font-size:10px;color:var(--cf-dim);margin-left:5px}
#coinft-observatory .cf-vector-heading&gt;span{color:var(--cf-dim)}
#coinft-observatory .cf-vector-canvas{display:block;width:100%;height:155px;touch-action:none}
#coinft-observatory .cf-scale-label{font-size:9px;color:var(--cf-dim);text-align:center;margin-bottom:9px}
#coinft-observatory .cf-coordinate-values{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
#coinft-observatory .cf-coord{font-variant-numeric:tabular-nums;min-width:0}
#coinft-observatory .cf-coord&gt;span{display:block;color:var(--cf-dim);font-size:10px}
#coinft-observatory .cf-coord&gt;strong{font-size:15px;font-weight:400;display:block;letter-spacing:-.6px}
#coinft-observatory .cf-coord&gt;small{font-size:9px;display:block;color:var(--cf-dim)}
#coinft-observatory .cf-frame-note{font-size:9px;color:var(--cf-dim);margin-top:12px;text-align:center}
#coinft-observatory .cf-bottom-grid{display:block;border-top:0}
#coinft-observatory .cf-inspector{display:grid;grid-template-columns:minmax(240px,1fr) 1.4fr;gap:30px;align-items:center}
#coinft-observatory .cf-inspect-header{margin:0}
@media(max-width:900px){#coinft-observatory .cf-signal-layout{grid-template-columns:118px minmax(0,1fr)}#coinft-observatory .cf-wrench{grid-column:1/-1;border-left:0;border-top:1px solid var(--cf-line);padding:18px 24px}#coinft-observatory .cf-wrench-heading{justify-content:flex-start;gap:16px}#coinft-observatory .cf-spatial-panels{display:grid;grid-template-columns:1fr 1fr;gap:26px}#coinft-observatory .cf-spatial-panel+.cf-spatial-panel{border:0;margin:0;padding:0}#coinft-observatory .cf-vector-legend{justify-content:flex-start;gap:15px}#coinft-observatory .cf-vector-legend&gt;span:last-child{margin-left:0}#coinft-observatory .cf-vector-canvas{height:185px}#coinft-observatory .cf-coordinate-values{max-width:300px;margin:auto}#coinft-observatory .cf-inspector{display:block}#coinft-observatory .cf-inspect-header{margin-bottom:12px}#coinft-observatory #cf-network{height:510px}}
@media(max-width:600px){#coinft-observatory .cf-signal-layout{grid-template-columns:89px minmax(0,1fr)}#coinft-observatory .cf-inputs{padding:14px 8px;justify-content:flex-start;padding-top:45px}#coinft-observatory .cf-inputs h2{font-size:11px}#coinft-observatory .cf-inputs .cf-section-heading&gt;span{font-size:8px;letter-spacing:0}#coinft-observatory .cf-input-channel{grid-template-columns:12px minmax(0,1fr);gap:5px}#coinft-observatory .cf-input-number{grid-column:2;text-align:left;font-size:9px}#coinft-observatory .cf-input-bars{gap:7px}#coinft-observatory #cf-network{height:565px}#coinft-observatory .cf-spatial-panels{grid-template-columns:1fr;gap:24px}#coinft-observatory .cf-spatial-panel+.cf-spatial-panel{border-top:1px solid var(--cf-line);padding-top:20px}#coinft-observatory .cf-wrench{padding:18px}#coinft-observatory .cf-vector-canvas{height:205px}#coinft-observatory .cf-coord&gt;strong{font-size:18px}#coinft-observatory .cf-scale-label,#coinft-observatory .cf-coord&gt;small{font-size:10px}}
&lt;/style&gt;
&lt;style&gt;
#coinft-observatory{--cf-bg:#fff;--cf-panel:#f7f9fa;--cf-text:#303a40;--cf-dim:#697780;--cf-line:#e4e9ec;--cf-cyan:#087fad;--cf-pink:#9a6297;color-scheme:light;background:#fff;border-radius:0}
#coinft-observatory .cf-toolbar{padding:16px 22px}
#coinft-observatory button,#coinft-observatory select,#coinft-observatory input[type=number]{background:#fff;border-color:#d8dfe3;color:#394750}
#coinft-observatory button:hover,#coinft-observatory select:hover{background:#f0f5f7;border-color:#a4bbc7}
#coinft-observatory .cf-primary{background:#087fad;color:#fff;border-color:#087fad}
#coinft-observatory .cf-primary:hover{background:#066e96}
#coinft-observatory .cf-stage{background:#fff;border-top-color:#e4e9ec}
#coinft-observatory .cf-signal-layout{grid-template-columns:124px minmax(0,1fr) 300px}
#coinft-observatory #cf-network{height:490px}
#coinft-observatory .cf-stage-top&gt;span:last-child{display:none}
#coinft-observatory .cf-wrench{background:#fff;border-left-color:#e4e9ec;padding-top:18px}
#coinft-observatory .cf-vector-canvas{height:280px}
#coinft-observatory .cf-input-track{background:#e8eef1}
#coinft-observatory .cf-input-track:after{background:#a2b4bd}
#coinft-observatory .cf-input-number{color:#50626d}
#coinft-observatory .cf-pred-key:before{border-top-color:#087fad}
#coinft-observatory .cf-ref-key:before{border-top-color:#b06c24}
#coinft-observatory .cf-transport{background:#f8fafb}
#coinft-observatory .cf-note{color:#966222}
#coinft-observatory .cf-spatial-panels{display:block}
#coinft-observatory .cf-traces{position:relative;padding:17px 20px 12px;border-bottom:1px solid var(--cf-line);background:#fff}
#coinft-observatory .cf-traces-heading{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:0 8px 9px}
#coinft-observatory .cf-traces-heading&gt;span{font-size:11px;color:var(--cf-dim)}
#coinft-observatory .cf-trace-legend{display:flex;gap:16px;margin-left:auto;font-size:11px;color:var(--cf-dim)}
#coinft-observatory .cf-trace-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
#coinft-observatory .cf-trace{display:block;width:100%;height:180px;overflow:visible;touch-action:pan-y}
#coinft-observatory .cf-trace text{font:11px &quot;CoinFT Noto&quot;,sans-serif;fill:#62717a}
#coinft-observatory .cf-trace .cf-series{fill:none;stroke-width:1.8}
#coinft-observatory .cf-trace .cf-chart-model{stroke:#087fad}
#coinft-observatory .cf-trace .cf-chart-ref{stroke:#b06c24;stroke-dasharray:4 3}
#coinft-observatory #cf-trace-tooltip{position:absolute;z-index:5;pointer-events:none;padding:9px 12px;border:1px solid #dce4e8;border-radius:6px;background:#fff;color:#35454f;box-shadow:0 3px 14px #22334414;font-size:11px;line-height:1.7;white-space:pre-line;font-variant-numeric:tabular-nums}
@media(max-width:900px){#coinft-observatory .cf-signal-layout{grid-template-columns:110px minmax(0,1fr)}#coinft-observatory .cf-wrench{display:block}#coinft-observatory .cf-vector-canvas{height:300px}#coinft-observatory .cf-spatial-panel{max-width:440px;margin:auto}#coinft-observatory .cf-trace-grid{grid-template-columns:1fr}#coinft-observatory .cf-trace{height:160px}}
@media(max-width:600px){#coinft-observatory .cf-signal-layout{grid-template-columns:89px minmax(0,1fr)}#coinft-observatory #cf-network{height:565px}#coinft-observatory .cf-toolbar{padding:14px}#coinft-observatory .cf-traces{padding:16px 10px}#coinft-observatory .cf-trace-legend{margin-left:0}#coinft-observatory .cf-traces-heading{gap:8px 14px}#coinft-observatory .cf-trace{height:170px}}
&lt;/style&gt;

&lt;style&gt;
#coinft-observatory .cf-signal-layout{grid-template-columns:124px minmax(0,1fr)}
#coinft-observatory .cf-stage{border-bottom:0}
#coinft-observatory .cf-transport{background:#fff}
#coinft-observatory .cf-force-comparison{padding:8px 30px 24px}
#coinft-observatory .cf-coordinate-values{max-width:none;margin:0;gap:18px}
#coinft-observatory .cf-coord&gt;span,#coinft-observatory .cf-coord&gt;small{font-size:11px}
#coinft-observatory .cf-coord&gt;strong{font-size:22px;letter-spacing:-.5px;margin:4px 0}
@media(max-width:900px){#coinft-observatory .cf-signal-layout{grid-template-columns:110px minmax(0,1fr)}}

<script>// Notify a same-origin parent when the exported page's content changes height.
(() => {
  if (window.parent === window) return;

  const report = () => {
    const frame = document.getElementById('codex-visualization');
    if (!frame) return;
    const height = Math.ceil(frame.getBoundingClientRect().height);
    if (height === previous || height < 100) return;
    previous = height;
    window.parent.postMessage({ type: 'coinft:height', height }, window.location.origin);
  };
