<!-- Responsive CoinFT embed for a Jekyll Markdown page. -->
<div style="width:100%;margin:0;">
  <iframe
    id="coinft-demo"
    src="{{ '/coinft.html' | relative_url }}"
    title="CoinFT neural network: inputs, inference, and force comparison"
    loading="lazy"
    style="display:block;width:100%;height:920px;border:0;background:#fff;"
  ></iframe>
</div>
<script>
(() => {
  const demo = document.getElementById('coinft-demo');
  window.addEventListener('message', event => {
    if (event.source !== demo.contentWindow || event.origin !== window.location.origin) return;
    if (event.data?.type !== 'coinft:height') return;
    const height = event.data.height;
    if (Number.isFinite(height) && height >= 100 && height <= 10000) {
      demo.style.height = Math.ceil(height) + 'px';
    }
  });
})();
</script>
